<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Renigo Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    /* Renigo design system (in progress) */
    --bg: #F0FCE0;      /* lime canvas */
    --fill: #ECF8DC;    /* input fill */
    --leaf: #E4F0D4;    /* leaf surface */
    --lime: #D0E898;    /* lime accent */
    --olive: #4C6810;
    --deep: #384C00;
    --ink: #141C0C;
    --muted: #585C50;
    --faint: #8A8E84;
    --line: #E4F0D4;
    --card: #FFFFFF;
    --amber-bg: #FBEFD2; --amber: #8A6510;
    --red-bg: #FDE7E4;   --red: #C8423A;
    --r: 20px;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
    color: var(--ink); background: #dfe8d6;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  body::before { content: ""; position: fixed; inset: -40px; z-index: -1; background: url("assets/renigo-bg.png") center / cover no-repeat; filter: blur(18px) saturate(.85) brightness(1.08); }
  body::after { content: ""; position: fixed; inset: 0; z-index: -1; background: rgba(240, 245, 236, .35); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  input, select, textarea { font: inherit; color: inherit; }
  i.ti { line-height: 1; }

  /* ---------- Phone frame ---------- */
  .phone { width: 390px; height: 844px; border-radius: 56px; padding: 12px; background: #111; box-shadow: 0 40px 80px rgba(0,0,0,.35), inset 0 0 0 2px #333; position: relative; flex-shrink: 0; }
  .island { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); width: 120px; height: 34px; background: #000; border-radius: 20px; z-index: 90; }
  .device { width: 100%; height: 100%; border-radius: 44px; overflow: hidden; background: var(--bg); position: relative; }
  .statusbar { position: absolute; top: 0; left: 0; right: 0; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 34px; font-weight: 600; font-size: 15px; z-index: 80; pointer-events: none; transition: color .3s; }
  .statusbar.light { color: #fff; }
  .statusbar .sb-icons { display: flex; gap: 4px; align-items: center; font-size: 17px; }
  @media (max-width: 440px), (max-height: 760px) {
    body { align-items: stretch; }
    .phone { width: 100%; height: 100dvh; border-radius: 0; padding: 0; box-shadow: none; }
    .island { display: none; }
    .device { border-radius: 0; }
  }
  html.embed body { background: transparent; min-height: 0; height: 100%; align-items: center; }
  html.embed body::before, html.embed body::after { display: none; }
  html.embed .phone { width: 390px; height: 844px; border-radius: 56px; padding: 12px; box-shadow: 0 24px 40px rgba(20,40,25,.22), inset 0 0 0 2px #333; }
  html.embed .island { display: block; }
  html.embed .device { border-radius: 44px; }

  /* ---------- Screen scaffolding ---------- */
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); padding-top: 50px; }
  .screen.enter { animation: slideIn .34s var(--ease); }
  .screen.back { animation: slideBack .3s var(--ease); }
  .screen.fade { animation: fadeIn .3s ease; }
  @keyframes slideIn { from { transform: translateX(28%); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes slideBack { from { transform: translateX(-12%); opacity: .4; } to { transform: none; opacity: 1; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
  .content { flex: 1; overflow-y: auto; padding: 4px 16px 28px; scrollbar-width: none; }
  .content::-webkit-scrollbar { display: none; }
  .content > * { animation: rise .45s var(--ease) both; }
  .content > *:nth-child(2) { animation-delay: .03s; } .content > *:nth-child(3) { animation-delay: .06s; }
  .content > *:nth-child(4) { animation-delay: .09s; } .content > *:nth-child(5) { animation-delay: .12s; }
  .content > *:nth-child(n+6) { animation-delay: .15s; }
  .footer { padding: 12px 16px 26px; display: flex; flex-direction: column; gap: 10px; background: linear-gradient(rgba(240,252,224,0), var(--bg) 26%); }

  /* Root header */
  .hdr { display: flex; align-items: center; justify-content: space-between; padding: 6px 16px 10px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo { width: 36px; height: 36px; border-radius: 11px; background: var(--olive); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 18px; position: relative; box-shadow: 0 4px 10px rgba(56,76,0,.25); }
  .logo::after { content: ""; position: absolute; top: 7px; right: 7px; width: 5px; height: 5px; border-radius: 50%; background: var(--lime); }
  .brand small { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: .08em; color: var(--olive); }
  .brand b { font-size: 17px; font-weight: 600; }
  .hdr-r { display: flex; gap: 8px; align-items: center; }
  .round { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; position: relative; transition: transform .15s; }
  .round:active { transform: scale(.92); }
  .round.soft { background: rgba(255,255,255,.7); }
  .pip { position: absolute; top: 8px; right: 9px; width: 9px; height: 9px; border-radius: 50%; background: #5DBB2E; border: 2px solid var(--bg); }

  /* Sub-page header */
  .bk { display: flex; align-items: center; gap: 10px; margin: 2px 0 10px; }
  .bk button { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; margin-left: -8px; font-size: 22px; }
  .bk button:active { background: var(--leaf); }
  .eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--olive); }
  .h1 { font-size: 27px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 6px; line-height: 1.15; }
  .lead { font-size: 14px; color: var(--muted); margin: 0 0 18px; line-height: 1.5; }

  /* Cards & sections */
  .card { background: var(--card); border-radius: var(--r); padding: 16px; box-shadow: 0 1px 2px rgba(30,50,10,.03), 0 6px 18px rgba(30,50,10,.04); }
  .card + .card, .stack > * + * { margin-top: 12px; }
  .sec { display: flex; align-items: center; justify-content: space-between; margin: 24px 2px 12px; }
  .sec h2 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  .sec .link { font-size: 13px; font-weight: 600; color: var(--olive); }
  .card-h { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 14px; }
  .card-h > i { font-size: 22px; color: var(--deep); margin-top: 1px; }
  .card-h b { font-size: 17px; font-weight: 600; display: block; }
  .card-h small { font-size: 12.5px; color: var(--muted); }
  .card-h .grow { flex: 1; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .hint { font-size: 12.5px; color: var(--faint); margin: 8px 2px 0; line-height: 1.45; }

  /* Pills */
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--leaf); color: var(--deep); }
  .pill.lime { background: var(--lime); }
  .pill.amber { background: var(--amber-bg); color: var(--amber); }
  .pill.red { background: var(--red-bg); color: var(--red); }
  .pill.grey { background: #EEF0EA; color: var(--muted); }
  .pill.dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill.mono { font-family: ui-monospace, Menlo, monospace; font-weight: 500; font-size: 11.5px; border-radius: 6px; padding: 3px 7px; }

  /* Buttons */
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 52px; padding: 0 18px; border-radius: 16px; background: var(--olive); color: #fff; font-weight: 600; font-size: 16px; box-shadow: 0 8px 18px rgba(56,76,0,.22); transition: transform .12s, background .2s, box-shadow .2s; }
  .btn:active { transform: scale(.98); background: var(--deep); box-shadow: 0 4px 10px rgba(56,76,0,.2); }
  .btn i { font-size: 20px; }
  .btn.soft { background: var(--leaf); color: var(--deep); box-shadow: none; }
  .btn.white { background: #fff; color: var(--ink); box-shadow: none; }
  .btn.dark { background: #283020; box-shadow: none; }
  .btn.ghost { background: transparent; color: var(--deep); box-shadow: none; height: 44px; }
  .btn.danger { background: transparent; color: var(--red); box-shadow: none; height: 44px; font-size: 14px; }
  .btn.sm { height: 38px; width: auto; padding: 0 16px; font-size: 13.5px; border-radius: 12px; box-shadow: none; }
  .btn.loading { pointer-events: none; }
  .btn.loading::after { content: ""; width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.4); border-top-color: #fff; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Inputs */
  .field { margin-bottom: 14px; }
  .field > label, .lbl { display: flex; justify-content: space-between; font-size: 13.5px; font-weight: 500; margin-bottom: 8px; }
  .field > label em, .lbl em { font-style: normal; color: var(--olive); font-weight: 600; font-size: 12px; }
  .inp { display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 14px; border-radius: 14px; background: var(--fill); border: 1.5px solid transparent; transition: border-color .15s, background .15s; }
  .inp:focus-within { border-color: var(--olive); background: #fff; }
  .inp.err { border-color: var(--red); background: #fff; animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .inp > i { font-size: 20px; color: var(--muted); }
  .inp input, .inp select { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 15px; height: 100%; }
  .inp input::placeholder, textarea::placeholder { color: #A3A89C; }
  .inp select { appearance: none; cursor: pointer; }
  textarea.ta { width: 100%; min-height: 92px; resize: none; border-radius: 14px; background: var(--fill); border: 1.5px solid transparent; padding: 13px 14px; font-size: 15px; outline: 0; }
  textarea.ta:focus { border-color: var(--olive); background: #fff; }
  .card .inp, .card textarea.ta { background: var(--fill); }

  /* Option chips (2-col) */
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .opt { display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border-radius: 13px; background: var(--leaf); color: var(--deep); font-size: 14px; font-weight: 500; transition: background .15s, color .15s, transform .12s; }
  .opt i { font-size: 18px; }
  .opt:active { transform: scale(.97); }
  .opt.on { background: var(--olive); color: #fff; }
  .opt-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .optc { display: flex; gap: 10px; align-items: center; padding: 12px; border-radius: 16px; background: #fff; border: 1.5px solid var(--line); text-align: left; transition: all .15s; }
  .optc .ic { width: 38px; height: 38px; border-radius: 11px; background: var(--leaf); color: var(--deep); display: grid; place-items: center; font-size: 20px; flex-shrink: 0; transition: all .15s; }
  .optc b { display: block; font-size: 14px; font-weight: 600; }
  .optc small { font-size: 11.5px; color: var(--muted); }
  .optc.on { background: var(--lime); border-color: var(--lime); }
  .optc.on .ic { background: var(--olive); color: #fff; }
  .radio { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 16px; background: #fff; border: 1.5px solid var(--line); text-align: left; width: 100%; transition: all .15s; }
  .radio + .radio { margin-top: 10px; }
  .radio .rb { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #9AA08F; flex-shrink: 0; margin-top: 1px; display: grid; place-items: center; }
  .radio.on { background: var(--lime); border-color: var(--lime); }
  .radio.on .rb { border-color: var(--deep); }
  .radio.on .rb::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--deep); }
  .radio b { display: block; font-size: 15px; font-weight: 600; }
  .radio small { font-size: 12.5px; color: var(--muted); }

  /* Scroll chips & segmented */
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px 14px; padding: 0 16px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; padding: 8px 15px; border-radius: 999px; font-size: 13px; font-weight: 500; background: var(--leaf); color: var(--deep); transition: all .15s; }
  .chip.on { background: var(--deep); color: #fff; }
  .seg { display: flex; padding: 4px; border-radius: 14px; background: var(--leaf); margin-bottom: 16px; position: relative; }
  .seg button { flex: 1; height: 38px; border-radius: 11px; font-size: 13.5px; font-weight: 600; color: var(--muted); position: relative; z-index: 1; transition: color .2s; }
  .seg button.on { color: var(--deep); }
  .seg .thumb { position: absolute; top: 4px; bottom: 4px; border-radius: 11px; background: #fff; box-shadow: 0 2px 6px rgba(30,50,10,.08); transition: left .3s var(--ease), width .3s var(--ease); }

  /* Toggle */
  .tgl { width: 50px; height: 30px; border-radius: 999px; background: #CDD3C5; position: relative; transition: background .2s; flex-shrink: 0; }
  .tgl::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.15); transition: transform .25s var(--ease); }
  .tgl.on { background: var(--olive); }
  .tgl.on::after { transform: translateX(20px); }
  .reveal { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s var(--ease); }
  .reveal > div { overflow: hidden; }
  .reveal.open { grid-template-rows: 1fr; }

  /* Lists */
  .row { display: flex; align-items: center; gap: 12px; padding: 14px; width: 100%; text-align: left; }
  .row .grow { flex: 1; min-width: 0; }
  .row .t { font-weight: 600; font-size: 15px; }
  .row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
  button.row:active, button.card:active { transform: scale(.985); }
  button.card { width: 100%; text-align: left; transition: transform .12s; display: block; }
  button.card.row { display: flex; }
  .tight .t, .tight .s { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list > * + * { margin-top: 10px; }
  .sq { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; background: var(--leaf); color: var(--deep); font-size: 22px; flex-shrink: 0; }
  .sq.entry { background: var(--lime); }
  .sq.exit { background: var(--amber-bg); color: var(--amber); }
  .divide > * + * { border-top: 1px solid var(--line); }

  .avatar { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; color: #fff; flex-shrink: 0; font-size: 15px; overflow: hidden; position: relative; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .av-wrap { position: relative; flex-shrink: 0; }
  .av-dot { position: absolute; right: -1px; bottom: -1px; width: 15px; height: 15px; border-radius: 50%; border: 2.5px solid #fff; }

  /* Home */
  .welcome { display: flex; justify-content: space-between; align-items: flex-end; margin: 14px 2px 16px; }
  .welcome small { font-size: 14px; color: var(--muted); }
  .welcome h1 { margin: 2px 0 0; font-size: 28px; font-weight: 600; letter-spacing: -.02em; }
  .key { padding: 16px; }
  .key-top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .key-top .sq { border-radius: 50%; }
  .key-top b { display: block; font-size: 16px; font-weight: 600; }
  .key-top small { font-size: 12.5px; color: var(--muted); }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { background: #fff; border-radius: 18px; padding: 14px; text-align: left; position: relative; box-shadow: 0 1px 2px rgba(30,50,10,.03), 0 6px 18px rgba(30,50,10,.04); transition: transform .12s; }
  .tile:active { transform: scale(.97); }
  .tile > i { font-size: 26px; color: var(--olive); }
  .tile b { display: block; font-size: 15.5px; font-weight: 600; margin-top: 16px; }
  .tile small { font-size: 12px; color: var(--muted); }
  .tile .badge { position: absolute; top: 14px; right: 12px; font-size: 11.5px; font-weight: 600; color: var(--olive); }
  .tile .badge.tag { background: var(--leaf); padding: 2px 7px; border-radius: 6px; }
  .tile .badge.live::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--olive); }
  .news { overflow: hidden; padding: 0; }
  /* Card and article share one aspect ratio so the photo is cropped the same way in both */
  .news .img, .news-img { aspect-ratio: 2.2 / 1; overflow: hidden; }
  .news .img img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s var(--ease); }
  .news:active .img img { transform: scale(1.04); }
  .news .body { padding: 14px 16px 16px; }
  .news .meta { display: flex; justify-content: space-between; font-size: 11.5px; }
  .news .meta b { font-weight: 600; letter-spacing: .08em; color: var(--olive); }
  .news h3 { font-size: 17px; font-weight: 600; margin: 8px 0 6px; line-height: 1.3; }
  .news p { font-size: 13.5px; color: var(--muted); margin: 0; line-height: 1.5; }

  /* Facilities */
  .fac { padding: 0; overflow: hidden; }
  .fac .img { height: 136px; position: relative; }
  .fac .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .fac .img .pill { position: absolute; left: 12px; top: 12px; background: rgba(255,255,255,.92); }
  .fac .info { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 14px; gap: 10px; }
  .fac .info b { font-size: 16px; font-weight: 600; }
  .days { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -20px; padding: 0 20px; }
  .days::-webkit-scrollbar { display: none; }
  .day { flex-shrink: 0; width: 56px; padding: 10px 0; border-radius: 15px; background: var(--fill); text-align: center; transition: all .15s; }
  .day b { display: block; font-size: 18px; margin-top: 2px; font-weight: 600; }
  .day span { font-size: 12px; color: var(--muted); }
  .day.on { background: var(--olive); color: #fff; }
  .day.on span { color: var(--lime); }
  .slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .slot { padding: 11px 0; border-radius: 12px; background: var(--fill); font-size: 13px; font-weight: 500; text-align: center; transition: all .15s; }
  .slot.on { background: var(--olive); color: #fff; }
  .slot:disabled { color: #B7BBB0; background: #F3F5EF; text-decoration: line-through; cursor: not-allowed; }
  .stepper { display: flex; align-items: center; gap: 14px; }
  .stepper button { width: 40px; height: 40px; border-radius: 12px; background: var(--leaf); font-size: 18px; display: grid; place-items: center; }
  .stepper b { min-width: 22px; text-align: center; font-size: 17px; }

  /* Schedule bits */
  .time2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tbox { background: var(--fill); border-radius: 14px; padding: 12px 14px; position: relative; }
  .tbox small { font-size: 11.5px; color: var(--muted); font-weight: 500; display: block; }
  .tbox input { border: 0; background: transparent; font-size: 19px; font-weight: 600; width: 100%; outline: 0; padding: 4px 0 0; }
  .weekdays { display: flex; gap: 6px; }
  .wd { flex: 1; height: 50px; border-radius: 12px; background: var(--leaf); display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: var(--deep); transition: all .15s; }
  .wd small { font-size: 8.5px; font-weight: 600; opacity: .7; }
  .wd.on { background: var(--olive); color: #fff; }
  .window { margin-top: 12px; background: var(--fill); border-radius: 14px; padding: 12px 14px; }
  .window .top { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--deep); }
  .wbar { position: relative; height: 10px; border-radius: 5px; background: var(--leaf); margin: 12px 0 6px; }
  .wbar i { position: absolute; top: 0; bottom: 0; background: var(--olive); border-radius: 5px; transition: left .3s var(--ease), width .3s var(--ease); }
  .window .ticks { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }

  /* Progress */
  .progress-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 13px; font-weight: 500; color: var(--deep); }
  .pbar { height: 7px; border-radius: 4px; background: var(--leaf); overflow: hidden; margin-bottom: 18px; }
  .pbar i { display: block; height: 100%; background: var(--deep); border-radius: 4px; transition: width .5s var(--ease); }

  /* Pass card */
  .pass { background: var(--deep); color: #fff; border-radius: 24px; overflow: hidden; box-shadow: 0 18px 36px rgba(56,76,0,.3); position: relative; }

const dayLabel = days => {

  if (k === '1111100') return 'Mon – Fri';

  return ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].filter((_, i) => days[i]).join(', ') || 'No days';
};

function qrSvg(seed) {
  let h = [...seed].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
  const r = () => (h = (h * 1103515245 + 12345) >>> 0) / 4294967296;
  const n = 25, cells = [];
  const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" rx="1.6" fill="#384C00"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" rx="1.1" fill="#fff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3" rx=".8" fill="#384C00"/>`;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const inF = (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
    const mid = x > 9 && x < 15 && y > 9 && y < 15;
    if (!inF && !mid && r() > .52) cells.push(`<rect x="${x + .08}" y="${y + .08}" width=".84" height=".84" rx=".25"/>`);
  }
  return `<svg viewBox="0 0 ${n} ${n}" width="100%" height="100%"><g fill="#384C00">${cells.join('')}</g>${finder(0, 0)}${finder(n - 7, 0)}${finder(0, n - 7)}<rect x="10.4" y="10.4" width="4.2" height="4.2" rx="1.2" fill="#4C6810"/><path d="M12.5 11.3l1.2.5v.9c0 .7-.5 1.2-1.2 1.5-.7-.3-1.2-.8-1.2-1.5v-.9z" fill="#fff"/></svg>`;
}

/* ================= Sheets & toast ================= */
function sheet(html, { update = false } = {}) {
  const open = device.querySelector('.sheet');
  if (update && open) {
    const top = open.scrollTop, left = open.querySelector('.days')?.scrollLeft;
    open.innerHTML = `<div class="grab"></div>${html}`;
    open.scrollTop = top;
    if (left != null && open.querySelector('.days')) open.querySelector('.days').scrollLeft = left;
    return;
  }
  closeSheet(true);
  device.insertAdjacentHTML('beforeend', `<div class="scrim" data-act="closeSheet"></div><div class="sheet"><div class="grab"></div>${html}</div>`);
}
function closeSheet(instant) {
  const sh = device.querySelector('.sheet'), sc = device.querySelector('.scrim');
  if (!sh) return;
  if (instant === true) { sh.remove(); sc?.remove(); return; }
  sh.classList.add('closing'); sh.style.transform = 'translateY(100%)';
  sc && (sc.style.transition = 'opacity .22s', sc.style.opacity = 0);
  setTimeout(() => { sh.remove(); sc?.remove(); }, 220);
}
// Drag the sheet handle down to dismiss
let drag = null;
device.addEventListener('pointerdown', e => {
  const g = e.target.closest('.sheet .grab'); if (!g) return;
  const sh = g.parentElement; drag = { sh, y: e.clientY, dy: 0 }; sh.classList.add('dragging'); g.setPointerCapture(e.pointerId);
});
device.addEventListener('pointermove', e => { if (!drag) return; drag.dy = Math.max(0, e.clientY - drag.y); drag.sh.style.transform = `translateY(${drag.dy}px)`; });
device.addEventListener('pointerup', () => {
  if (!drag) return; const { sh, dy } = drag; drag = null; sh.classList.remove('dragging');
  if (dy > 110) closeSheet(); else { sh.style.transition = 'transform .25s var(--ease)'; sh.style.transform = ''; setTimeout(() => sh.style.transition = '', 260); }
});

function toast(msg, icon = 'circle-check') {
  device.querySelectorAll('.toast').forEach(e => e.remove());
  device.insertAdjacentHTML('beforeend', `<div class="toast">${ic(icon)}${msg}</div>`);
  setTimeout(() => device.querySelector('.toast')?.remove(), 2400);
}
function need(form, names) {
  let ok = true;
  names.forEach(n => {
    const el = form.elements[n], box = el.closest('.inp') || el;
    const bad = !el.value.trim();
    box.classList.toggle('err', bad);
    if (bad && ok) { el.focus(); ok = false; }
  });
  return ok;
}

/* ================= Live form helpers ================= */
function updateHours() {
  const f = document.getElementById('vpForm'); if (!f) return;
  const m = s => { const [h, mm] = s.split(':').map(Number); return h * 60 + mm; };
  let d = (m(f.to.value) - m(f.from.value)) / 60; if (d <= 0) d += 24;
  document.getElementById('hrsPill').textContent = `${Math.round(d * 10) / 10} hours`;
}
function updateWindow() {
  const f = document.getElementById('wizForm'); if (!f || !f.from) return;
  const m = s => { const [h, mm] = s.split(':').map(Number); return h * 60 + mm; };
  const a = m(f.from.value), b = m(f.to.value), span = Math.max(0, b - a);
  const bar = document.getElementById('winBar');
  bar.style.left = (a / 1440 * 100) + '%'; bar.style.width = (span / 1440 * 100) + '%';
  document.getElementById('winLabel').textContent = `${t12(f.from.value)} – ${t12(f.to.value)}`;
  document.getElementById('shiftPill').textContent = `${Math.round(span / 6) / 10}h shift`;
}

function collectWizard() {
  const f = document.getElementById('wizForm'), d = R.wiz.data;
  if (R.wiz.step === 1) { Object.assign(d, { first: f.first.value.trim(), last: f.last.value.trim(), phone: f.phone.value.trim(), idno: f.idno.value.trim(), idType: groupVal(f, 'idType') }); }
  if (R.wiz.step === 2) { Object.assign(d, { role: groupVal(f, 'role'), emp: groupVal(f, 'emp') }); }
  if (R.wiz.step === 3) { Object.assign(d, { days: [...f.querySelectorAll('.wd')].map(x => x.classList.contains('on') ? 1 : 0), from: f.from.value, to: f.to.value, expiry: groupVal(f, 'expiry') }); }
  if (R.wiz.step === 4) { d.zones = Object.fromEntries([...f.querySelectorAll('[data-zone]')].map(x => [x.dataset.zone, x.classList.contains('on') ? 1 : 0])); }
}
function afterWizardRender() {
  requestAnimationFrame(() => {
    const bar = document.querySelector('.pbar i'); if (bar) bar.style.width = bar.dataset.to;
    updateWindow();
  });
}

/* ================= Actions ================= */
const A = {
  back: pop,
  tab: d => setTab(d.tab),
  go: d => { if (d.to === 'notifications') S.unread = false; push(d.to); },
  sub: d => { R.sub[d.key] = d.val; render(); },
  filter: d => { R.filter = d.val; render(); },
  closeSheet: () => closeSheet(),
  soon: () => toast('Coming soon in the full app', 'sparkles'),

  // Auth
  peek: (_, el) => { const i = el.parentElement.querySelector('input'); i.type = i.type === 'password' ? 'text' : 'password'; el.innerHTML = ic(i.type === 'password' ? 'eye' : 'eye-off', 20); },
  login: (_, el) => {
    el.classList.add('loading'); el.innerHTML = 'Signing in';
    setTimeout(() => { R.authed = true; R.tab = 'home'; R.stack = []; R.anim = 'fade'; render(); toast('Welcome back, John', 'hand-stop'); }, 900);
  },
  faceid: () => {
    device.insertAdjacentHTML('beforeend', `<div class="scan-overlay"><div><div class="box scanline">${ic('face-id')}</div><p>Looking for your face…</p></div></div>`);
    setTimeout(() => { const o = device.querySelector('.scan-overlay .box'); o.classList.add('ok'); o.classList.remove('scanline'); o.innerHTML = ic('check'); o.nextElementSibling.textContent = 'Verified'; }, 1100);
    setTimeout(() => { device.querySelector('.scan-overlay')?.remove(); R.authed = true; R.tab = 'home'; R.anim = 'fade'; render(); }, 1700);
  },
  logout: () => { R.authed = false; R.stack = []; R.tab = 'home'; R.anim = 'fade'; render(); },

  // Home
  ownerPass: () => sheet(`<h3 style="margin-bottom:14px">My gate pass</h3>${ownerPassCard()}`),
  news: d => {
    const n = S.news.find(x => x.id == d.id);
    sheet(`<div class="cover news-img" style="border-radius:18px;overflow:hidden;margin-bottom:16px">${img(n.img, '')}</div>
      <div class="eyebrow">${n.tag}</div><h3 style="margin-top:6px">${n.title}</h3>
      <div class="small muted" style="margin-bottom:12px">${n.when} · Village admin</div>
      <p style="line-height:1.6;margin:0 0 20px;color:var(--muted)">${n.body}</p><button class="btn soft" data-act="closeSheet">Got it</button>`);
  },
  readAll: () => { S.notifs.forEach(n => n.unread = false); render(); toast('All caught up'); },
  copy: d => { navigator.clipboard?.writeText(d.val).catch(() => {}); toast('Copied to clipboard', 'copy'); },
  wallet: () => toast('Added to Wallet', 'wallet'),
  offline: () => toast('Pass saved for offline use', 'wifi-off'),
  share: () => toast('Share sheet opened', 'share'),
  resend: () => toast('SMS sent again', 'message-2'),

  // Facilities
  book: d => { bk = { fac: d.id, date: iso(today), slot: null, guests: 2 }; bookingSheet(); },
  bkDay: d => { bk.date = d.val; bk.slot = null; bookingSheet(); },
  bkSlot: d => { bk.slot = d.val; bookingSheet(); },
  bkGuests: d => { bk.guests = Math.min(10, Math.max(1, bk.guests + +d.val)); bookingSheet(); },
  bkConfirm: () => {
    if (!bk.slot) return;
    S.bookings.unshift({ id: Date.now(), fac: bk.fac, date: bk.date, slot: bk.slot, guests: bk.guests, status: 'Confirmed' });
    closeSheet(); setTimeout(() => { render(); toast('Booking confirmed'); }, 230);
  },
  cancelBooking: d => sheet(`<h3>Cancel this booking?</h3><p class="lead" style="margin:6px 0 20px">You can book again anytime if slots are free.</p>
      <button class="btn" style="background:var(--red);box-shadow:none" data-act="cancelYes" data-id="${d.id}">Yes, cancel booking</button>
      <button class="btn ghost" style="margin-top:6px" data-act="closeSheet">Keep it</button>`),
  cancelYes: d => { S.bookings.find(b => b.id == d.id).status = 'Cancelled'; render(); toast('Booking cancelled', 'calendar-x'); },

  // Generic pickers (DOM-only selection state)
  pick: (_, el) => {
    const g = el.closest('[data-group]'); g.querySelectorAll('.on').forEach(x => x.classList.remove('on')); el.classList.add('on');
    if (g.dataset.group === 'purpose') document.getElementById('otherPurpose').classList.toggle('open', el.dataset.val === 'Other');
  },
  pickCard: (_, el) => A.pick(_, el),
  pickRadio: (_, el) => A.pick(_, el),
  pickChip: (_, el) => A.pick(_, el),
  pickDate: (_, el) => A.pick(_, el),

  // Visitor passes
  toggleVehicle: (_, el) => { el.classList.toggle('on'); document.getElementById('vehicleBox').classList.toggle('open', el.classList.contains('on')); },
  createPass: (_, el) => {
    const f = document.getElementById('vpForm');
    if (!need(f, ['name', 'phone'])) return;
    const veh = document.querySelector('[data-act="toggleVehicle"]').classList.contains('on');
    if (veh && !need(f, ['plate'])) return;
    let purpose = groupVal(f, 'purpose'); if (purpose === 'Other' && f.other.value.trim()) purpose = f.other.value.trim();
    const p = {
      id: 'VP-' + rnd(48300, 49999), name: f.name.value.trim(), phone: f.phone.value.trim(), purpose,
      date: groupVal(f, 'when'), from: f.from.value, to: f.to.value,
      vehicle: veh ? { plate: f.plate.value.trim().toUpperCase(), model: f.model.value.trim() } : null,
      bay: (f.querySelector('#vehicleBox b')?.textContent || '').replace('Visitor Bay ', ''), pin: `${rnd(100, 999)}-${rnd(100, 999)}`, status: 'live',
    };
    el.classList.add('loading'); el.innerHTML = 'Issuing pass';
    setTimeout(() => { S.passes.unshift(p); R.stack[R.stack.length - 1] = { name: 'passCreated', params: { id: p.id, fresh: true } }; R.anim = 'enter'; render(); }, 800);
  },
  openPass: d => push('passCreated', { id: d.id }),
  newPass: () => { R.stack = [{ name: 'visitors', params: {} }]; R.anim = 'enter'; render(); },
  revoke: d => sheet(`<h3>Revoke this pass?</h3><p class="lead" style="margin:6px 0 20px">The QR code and PIN will stop working at the gate immediately.</p>
      <button class="btn" style="background:var(--red);box-shadow:none" data-act="revokeYes" data-id="${d.id}">Revoke clearance</button><button class="btn ghost" style="margin-top:6px" data-act="closeSheet">Keep pass</button>`),
  revokeYes: d => { S.passes.find(p => p.id === d.id).status = 'revoked'; R.stack[R.stack.length - 1].params.fresh = false; render(); toast('Pass revoked', 'ban'); },

  // Staff
  staffFilter: d => { R.staffFilter = d.val; render(); },
  checkout: d => { const s = S.staff.find(x => x.id === d.id); s.status = 'off'; s.since = ''; render(); toast(`${s.name.split(' ')[0]} checked out`, 'logout'); },
  checkin: d => { const s = S.staff.find(x => x.id === d.id); s.status = 'on'; s.since = fmtTime(new Date()); render(); toast(`${s.name.split(' ')[0]} checked in`, 'login'); },
  extend: d => { const s = S.staff.find(x => x.id === d.id); toast(`${s.name.split(' ')[0]}'s access extended`, 'calendar-plus'); },
  staffProfile: d => {
    const s = S.staff.find(x => x.id === d.id);
    sheet(`<div style="text-align:center"><div style="display:flex;justify-content:center;margin:4px 0 12px">${avatar(s.name, 76)}</div><h3>${s.name}</h3><div class="small muted">${s.role}</div><div style="margin:10px 0 4px">${staffPill(s)}</div></div>
      <div class="qrbox" style="background:var(--fill);margin:16px 0"><div class="qr" style="width:132px;height:132px">${qrSvg(s.id)}</div><small>Staff ID #${s.id}</small></div>
      <div class="divide"><div class="kv"><span>Schedule</span><b>${s.days} · ${s.hours}</b></div><div class="kv"><span>Access</span><b>${s.zones.join(', ')}</b></div><div class="kv"><span>Category</span><b>${s.cat}</b></div></div>
      <button class="btn danger" style="margin-top:10px" data-act="suspend" data-id="${s.id}">${ic('lock', 16)} Suspend access</button>`);
  },
  suspend: d => { const s = S.staff.find(x => x.id === d.id); s.status = 'off'; s.since = ''; render(); toast('Access suspended', 'lock'); },
  addStaff: () => { R.wiz = { step: 1, data: {} }; if (R.stack.at(-1)?.name === 'staffDone') { R.stack[R.stack.length - 1] = { name: 'addStaff', params: {} }; R.anim = 'enter'; render(); } else push('addStaff'); afterWizardRender(); },
  wizBack: () => { collectWizard(); R.wiz.step--; R.anim = 'back'; render(); afterWizardRender(); },
  wizNext: () => {
    const f = document.getElementById('wizForm');
    if (R.wiz.step === 1 && !need(f, ['first', 'last', 'phone'])) return;
    if (R.wiz.step === 3 && !f.querySelector('.wd.on')) return toast('Pick at least one working day', 'alert-circle');
    collectWizard();
    if (R.wiz.step < 4) { R.wiz.step++; R.anim = 'enter'; render(); afterWizardRender(); return; }
    const d = R.wiz.data, zones = Object.entries(d.zones).filter(([, v]) => v).map(([k]) => k);
    const s = { id: 'STF-' + rnd(100, 999), name: `${d.first} ${d.last}`, role: d.role || 'Housekeeper', cat: d.role === 'Contractor' ? 'Contractor' : 'Domestic', days: dayLabel(d.days), hours: `${d.from} – ${d.to}`, zones: zones.length ? zones : ['Main Gate'], status: 'scheduled', since: 'Next shift' };
    S.staff.push(s);
    R.stack[R.stack.length - 1] = { name: 'staffDone', params: { id: s.id } }; R.anim = 'fade'; render();
  },
  doneStaff: () => { R.stack.pop(); if (R.stack.at(-1)?.name !== 'workers') R.stack.push({ name: 'workers', params: {} }); R.staffFilter = 'all'; R.anim = 'back'; render(); },
  dayPreset: d => { document.querySelectorAll('.wd').forEach((x, i) => x.classList.toggle('on', d.val[i] === '1')); updateDayCount(); },
  toggleDay: (_, el) => { el.classList.toggle('on'); updateDayCount(); },
  toggleZone: (_, el) => el.classList.toggle('on'),

  // Helpdesk
  newReq: d => sheet(`<h3>${d.cat}</h3><p class="lead" style="margin:4px 0 16px">The admin team usually responds within 24 hours.</p>
    <form id="reqForm" autocomplete="off" data-cat="${d.cat}" onsubmit="return false">
      <div class="field"><label>Describe the issue</label><textarea class="ta" name="desc" placeholder="e.g. Aircon is leaking water in the bedroom"></textarea></div>
      <div class="field"><label>Priority</label><div class="opts" data-group="prio" style="grid-template-columns:repeat(3,1fr)">${['Normal', 'High', 'Urgent'].map((p, k) => `<button type="button" class="opt ${k === 0 ? 'on' : ''}" data-act="pick" data-val="${p}">${p}</button>`).join('')}</div></div>
      <div class="field"><label>Photo (optional)</label><button type="button" class="inp" style="width:100%;justify-content:center;border:1.5px dashed #C4D9A0;color:var(--deep);font-weight:600;font-size:14px" data-act="soon">${ic('camera-plus')} Add a photo</button></div>
    </form><button class="btn" data-act="saveReq">Submit request</button>`),
  saveReq: () => {
    const f = document.getElementById('reqForm');
    if (!f.desc.value.trim()) { f.desc.style.borderColor = 'var(--red)'; f.desc.focus(); return; }
    const id = 'SR-' + (1033 + S.requests.length);
    S.requests.unshift({ id, cat: f.dataset.cat, desc: f.desc.value.trim(), date: iso(today), status: 'Pending' });
    R.sub.sr = 'mine'; closeSheet(); setTimeout(() => { render(); toast(`${id} submitted`); }, 230);
  },

  // Parking
  changeVehicle: () => sheet(`<h3>Select vehicle</h3><div class="list" style="margin-top:14px">${S.vehicles.map((v, i) => `
    <button class="card row" data-act="pickVehicle" data-i="${i}" style="box-shadow:none;border:1.5px solid ${i === S.activeVehicle ? 'var(--olive)' : 'var(--line)'}">
      <span class="sq" style="${i === S.activeVehicle ? 'background:var(--olive);color:#fff' : ''}">${ic('car')}</span>
      <div class="grow"><div class="t">${v.plate}</div><div class="s">${v.model} · ${v.color}</div></div>${i === S.activeVehicle ? `<span style="color:var(--olive);font-size:22px">${ic('circle-check-filled')}</span>` : ''}</button>`).join('')}</div>`),
  pickVehicle: d => { S.activeVehicle = +d.i; render(); toast('Active vehicle updated', 'car'); },
  saveVehicle: () => {
    const f = document.getElementById('vehForm');
    if (!need(f, ['plate', 'model'])) return;
    S.vehicles.push({ plate: f.plate.value.trim().toUpperCase(), model: f.model.value.trim(), color: groupVal(f, 'color'), slot: 'Street · Bay 6' });
    S.activeVehicle = S.vehicles.length - 1; pop(); toast('Vehicle registered', 'car');
  },
  visitorParking: () => sheet(`<h3>Visitor parking</h3><p class="lead" style="margin:4px 0 16px">Reserve a bay for a guest's car.</p>
    <div class="slots" data-group="bay" style="margin-bottom:16px">${['V-01', 'V-02', 'V-03', 'V-04', 'V-05', 'V-06'].map((s, i) => `<button class="slot" data-act="pickBay" data-val="${s}" ${i % 3 === 1 ? 'disabled' : ''}>${s}</button>`).join('')}</div>
    <div class="field"><label>Guest plate number</label><div class="inp">${ic('license')}<input placeholder="e.g. XTR 881" style="text-transform:uppercase" /></div></div>
    <button class="btn" data-act="reserveBay">Reserve bay</button>`),
  pickBay: (_, el) => { el.parentElement.querySelectorAll('.slot').forEach(s => s.classList.remove('on')); el.classList.add('on'); },
  reserveBay: () => { if (!device.querySelector('.sheet .slot.on')) return toast('Pick a bay first', 'alert-circle'); closeSheet(); toast('Visitor bay reserved', 'parking'); },

  // Household
  member: d => {
    const m = S.household[d.i];
    sheet(`<div style="text-align:center"><div style="display:flex;justify-content:center;margin:4px 0 12px">${avatar(m.name, 76)}</div><h3>${m.name}</h3><div class="small muted">${m.role} · ${m.email}</div></div>
      <div class="card divide" style="margin:18px 0;padding:2px 16px;box-shadow:none;background:var(--fill)">${[['Book facilities', true], ['Invite visitors', true], ['Manage staff', m.role !== 'Sub-account'], ['Pay dues', m.role === 'Owner']].map(([l, on]) => `
        <div class="row" style="padding:12px 0"><div class="grow small">${l}</div><span style="color:${on ? 'var(--olive)' : '#B7BBB0'};font-size:20px">${ic(on ? 'circle-check-filled' : 'circle-x')}</span></div>`).join('')}</div>
      ${m.role === 'Owner' ? '' : `<button class="btn danger" data-act="removeMember" data-i="${d.i}">Remove from household</button>`}`);
  },
  removeMember: d => { const [m] = S.household.splice(d.i, 1); render(); toast(`${m.name.split(' ')[0]} removed`); },
  inviteMember: () => sheet(`<h3>Invite member</h3><p class="lead" style="margin:4px 0 16px">They'll get a link to join your unit.</p>
    <form id="memForm" autocomplete="off" onsubmit="return false">
      <div class="field"><label>Full name</label><div class="inp">${ic('user')}<input name="name" placeholder="Enter full name" /></div></div>
      <div class="field"><label>Email or phone</label><div class="inp">${ic('mail')}<input name="email" placeholder="name@example.com" /></div></div>
      <div class="field"><label>Access type</label><div class="opts" data-group="role">${['Family Member', 'Sub-account'].map((r, k) => `<button type="button" class="opt ${k === 0 ? 'on' : ''}" data-act="pick" data-val="${r}">${r}</button>`).join('')}</div></div>
    </form><button class="btn" data-act="saveMember">Send invite</button>`),
  saveMember: () => {
    const f = document.getElementById('memForm');
    if (!need(f, ['name', 'email'])) return;
    S.household.push({ name: f.name.value.trim(), role: groupVal(f, 'role'), email: f.email.value.trim() });
    closeSheet(); setTimeout(() => { render(); toast('Invite sent', 'send'); }, 230);
  },
};

/* ================= Events ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  e.preventDefault();
  A[el.dataset.act]?.(el.dataset, el);
});
document.addEventListener('input', e => {
  e.target.closest?.('.inp')?.classList.remove('err');
  const c = e.target.dataset?.change;
  if (c === 'hours') updateHours();
  if (c === 'window') updateWindow();
  if (c === 'staffSearch') {
    R.staffQuery = e.target.value;
    const q = R.staffQuery.toLowerCase(), f = R.staffFilter;
    const list = S.staff.filter(s => (f === 'all' || s.status === f) && (!q || (s.name + s.role + s.id).toLowerCase().includes(q)));
    document.getElementById('staffList').innerHTML = list.length ? list.map(staffCard).join('') : empty('search', 'No matches', 'Try a different name or filter.');
  }
});

const tick = () => document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }).replace(/\s?[AP]M/, '');
tick(); setInterval(tick, 30000);
render();

// The case study page sends { type: 'renigo:goto', tab, screen, sub, action, data } as the reader scrolls.
window.addEventListener('message', e => {
  const d = e.data;
  if (!d || d.type !== 'renigo:goto') return;
  R.authed = true;
  R.tab = d.tab || 'home';
  R.stack = d.screen ? [{ name: d.screen, params: {} }] : [];
  R.sub = { ...(d.sub || {}) };
  if (d.screen === 'addStaff') R.wiz = { step: 1, data: {} };
  R.anim = 'enter';
  render();
  if (d.screen === 'addStaff') afterWizardRender();
  if (d.action) setTimeout(() => A[d.action]?.(d.data || {}), 380);
});
</script>
</body>
</html>
